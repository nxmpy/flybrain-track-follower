[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-track-follower"
version = "0.1.0"
description = "Camera path following for robots and drones on an insect-inspired robot bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["Pillow>=10"]
connectome = ["numba>=0.60"]

[project.scripts]
flybrain-robot = "flybrain_robot.main:main"
flybrain-track = "flybrain_robot.track_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
